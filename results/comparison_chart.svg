<svg viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial">
  <text x="180" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1f1c16">Selection Error Rate: Baseline vs Proposed</text>
  <line x1="40" y1="250" x2="330" y2="250" stroke="#333" stroke-width="1.5"/>
  <rect x="90" y="30" width="70" height="220" fill="#c0392b"/>
  <text x="125" y="268" text-anchor="middle" font-size="12" fill="#1f1c16">Baseline</text>
  <text x="125" y="22" text-anchor="middle" font-size="12" fill="#1f1c16">40.4%</text>
  <rect x="220" y="184" width="70" height="66" fill="#1e7e34"/>
  <text x="255" y="268" text-anchor="middle" font-size="12" fill="#1f1c16">Proposed</text>
  <text x="255" y="176" text-anchor="middle" font-size="12" fill="#1f1c16">10.1%</text>
</svg>